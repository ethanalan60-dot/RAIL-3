name: Bounded CPU contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release.py verify
      - run: python -m pip install -e .
      - run: python scripts/release_smoke.py
      - run: python -m unittest tests.test_release_gateway tests.test_release_entrypoints -v
      - run: python presentation/plot_saved_summaries.py --check-inputs
# This file is prepared, not run on GitHub. No secret, model, dataset,
# evaluation, bootstrap, artifact upload or manuscript publication is used.
